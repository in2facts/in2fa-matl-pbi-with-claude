<title>Ultimate Formula 1 Dashboard</title>
<style>
:root{
  /* Deliberately single-theme: a pit-wall timing screen reads dark, so every
     colour is painted explicitly rather than inherited from the host. */
  color-scheme:dark;
  --bg:#0b0e13; --panel:#141922; --panel2:#1b2230; --line:#252d3b;
  --tx:#e8ecf3; --tx2:#95a1b5; --tx3:#5f6b7f;
  --acc:#e8002d; --good:#22c55e; --warn:#f59e0b;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
  padding:22px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#7a0018);
  display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px}
.brand h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.1px}
.brand p{margin:1px 0 0;font-size:11px;color:var(--tx3)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{
  all:unset;cursor:pointer;padding:9px 11px;border-radius:8px;font-size:13px;color:var(--tx2);
  display:flex;align-items:center;gap:10px;transition:background .12s,color .12s;
}
nav button:hover{background:var(--panel2);color:var(--tx)}
nav button[aria-current="true"]{background:var(--panel2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
nav button .ico{width:16px;text-align:center;opacity:.85;font-size:13px}
.filters{display:flex;flex-direction:column;gap:12px}
.filters label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
select{
  width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;cursor:pointer;
}
select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.side-meta{margin-top:auto;font-size:11px;color:var(--tx3);line-height:1.6}
.side-meta a{color:var(--tx2)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{margin-bottom:22px}
.topbar h2{margin:0;font-size:22px;font-weight:650;letter-spacing:-.2px}
.topbar p{margin:5px 0 0;color:var(--tx2);font-size:13px}

.section{margin-bottom:26px}
.section > h3{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  margin:0 0 11px;font-weight:650;
}
.grid{display:grid;gap:12px}
.muted{color:var(--tx2)}
.tiny{font-size:11px}
.empty{padding:34px;text-align:center;color:var(--tx3);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap}
thead th{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:650;
  background:var(--panel2);position:sticky;top:0;border-bottom:1px solid var(--line);
}
tbody tr{border-top:1px solid var(--line)}
tbody tr:hover{background:#1a2129}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{font-variant-numeric:tabular-nums;color:var(--tx2);width:34px}
.pts{font-weight:650;font-variant-numeric:tabular-nums}

/* team colour accents */
.tbar{display:inline-block;width:3px;height:15px;border-radius:2px;vertical-align:-3px;margin-right:9px}
.tname{color:var(--tx2);font-size:12px}
.chip{
  display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:650;
  letter-spacing:.02em;
}
.delta{font-variant-numeric:tabular-nums;font-size:12px}
.delta.up{color:var(--good)}
.delta.zero{color:var(--tx3)}

/* ---------- stat tiles ---------- */
.tiles{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tile .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:7px}
.tile .v{font-size:17px;font-weight:650;letter-spacing:-.2px;line-height:1.25}
.tile .s{font-size:11px;color:var(--tx2);margin-top:3px}

/* ---------- schedule ---------- */
.sched{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
.race{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  position:relative;display:flex;flex-direction:column;gap:7px;
}
.race.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.race.past{opacity:.72}
.race .rd{
  position:absolute;top:12px;right:13px;font-size:11px;color:var(--tx3);
  font-variant-numeric:tabular-nums;
}
/* Country badge rather than a flag emoji: Windows Chromium renders
   regional-indicator pairs as bare letters, which reads as a rendering bug. */
.cc{
  display:inline-block;padding:2px 6px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.07em;
  color:var(--tx2);font-variant-numeric:tabular-nums;
}
.race .cc{align-self:flex-start;font-size:12px;padding:3px 8px}
td .cc{margin-right:7px}
.pg .cc{padding:1px 4px;font-size:10px;letter-spacing:.04em}
.race h4{margin:0;font-size:14px;font-weight:650;padding-right:26px}
.race .circ{font-size:12px;color:var(--tx2)}
.race .dates{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.b{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px}
.b.done{background:#1d2b22;color:#4ade80}
.b.next{background:var(--acc);color:#fff}
.b.up{background:var(--panel2);color:var(--tx3)}
.b.spr{background:#2b2410;color:var(--warn)}

/* ---------- cards (drivers / teams) ---------- */
.cards{grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dcard .top{display:flex;align-items:center;gap:12px;padding:14px 15px}
.mono{
  width:46px;height:46px;flex:0 0 46px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.dcard .who{min-width:0}
.dcard .who .n{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .who .t{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .no{margin-left:auto;font-size:19px;font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr}
.stats div{padding:9px 15px;border-top:1px solid var(--line)}
.stats div:nth-child(odd){border-right:1px solid var(--line)}
.stats .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.stats .v{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.lineup{display:flex;justify-content:space-between;gap:10px;padding:7px 15px;
  border-top:1px solid var(--line);font-size:13px}
.livery{height:8px;display:flex}
.livery i{flex:1}

/* ---------- points grid ---------- */
.pg{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-height:70vh}
.pg table{font-size:12px}
.pg th,.pg td{padding:6px 9px;text-align:center}
.pg thead th{z-index:3}
.pg th.dh,.pg td.dh{
  position:sticky;left:0;background:var(--panel);text-align:left;z-index:2;
  border-right:1px solid var(--line);min-width:168px;
}
.pg thead th.dh{z-index:4;background:var(--panel2)}
.pg tbody tr:hover td{background:#1a2129}
.pg td.z{color:var(--tx3)}
.pg td.dnf{color:#f87171;font-size:10px;font-weight:700;letter-spacing:.04em}
.pg td.win{font-weight:800;color:#fff}
.pg td.tot{font-weight:700;background:var(--panel2)}
.pg th.tot{background:var(--panel2)}

@media (max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:auto;flex:none;height:auto;position:static}
  nav{flex-direction:row;flex-wrap:wrap}
  .filters{flex-direction:row}
  main{padding:20px 16px 50px}
  .side-meta{margin-top:6px}
}
</style>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">F1</div>
      <div>
        <h1>Ultimate F1 Dashboard</h1>
        <p id="brandSub">&nbsp;</p>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="filters">
      <div>
        <label for="seasonSel">Season</label>
        <select id="seasonSel"></select>
      </div>
      <div>
        <label for="roundSel">As of round</label>
        <select id="roundSel"></select>
      </div>
    </div>

    <div class="side-meta">
      <div id="builtAt"></div>
      <div>Data: <a href="https://jolpi.ca" target="_blank" rel="noopener">Jolpica API</a></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="viewTitle"></h2>
      <p id="viewSub"></p>
    </div>
    <section id="view"></section>
  </main>
</div>

/* readable text colour over a team colour */
function ink(hex){
  const h = hex.replace("#", "");
  const v = [0,2,4].map(i => parseInt(h.slice(i,i+2), 16) / 255)
                   .map(c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  const L = 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
  return L > 0.42 ? "#0b0e13" : "#ffffff";
}

function fmtDate(iso){
  const p = iso.split("-");

function dateRange(a, b){
  if(!a || a === b) return fmtDate(b);

        D(q[0]).poles++;
        const row = r.res.find(x => x[R_DRV] === q[0]);
        if(row) T(row[R_TEAM]).poles++;
      }
    }
    /* winning margin = P2 total race time - P1 total race time */
    const p1 = r.res.find(x => x[R_POS] === 1), p2 = r.res.find(x => x[R_POS] === 2);
    if(p1 && p2 && p1[R_MS] != null && p2[R_MS] != null){
      const m = p2[R_MS] - p1[R_MS];
      if(!wideWin  || m > wideWin.m)  wideWin  = {m:m, id:p1[R_DRV], race:r};
      if(!tightWin || m < tightWin.m) tightWin = {m:m, id:p1[R_DRV], race:r};
    }
  }

  const mean = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  for(const id in d){
    d[id].avgFin = mean(d[id].finishes);
    d[id].avgQual = mean(d[id].qpos);
  }

  const rank = obj => Object.keys(obj)
    .map(id => Object.assign({id:id}, obj[id]))
    .sort((a,b) => b.pts - a.pts || b.wins - a.wins || b.podiums - a.podiums)
    .map((x,i) => Object.assign(x, {pos:i+1}));

  return {
    races:races, d:d, t:t, perTeam:perTeam,
    wdc: rank(d), wcc: rank(t),
    bigGain:bigGain, wideWin:wideWin, tightWin:tightWin,
    /* a regular started at least half the completed rounds - keeps a one-off
       stand-in from topping the average-finish stat */
    regulars: rank(d).filter(x => x.starts >= races.length / 2),
  };
}

/* ---------------- views ---------------- */
function vSchedule(){
  const s = S();
  const cards = s.races.map(r => {
    const cls = r.r === s.next ? "next" : (r.done ? "past" : "");
    const badge = r.done ? '<span class="b done">Completed</span>'
                : r.r === s.next ? '<span class="b next">Next race</span>'
                : '<span class="b up">Upcoming</span>';
    return '<div class="race ' + cls + '">'
      + '<span class="rd">R' + r.r + "</span>"
      + '<span class="cc">' + r.iso + "</span>"
      + "<h4>" + esc(r.name) + "</h4>"
      + '<div class="circ">' + esc(r.circuit) + "</div>"
      + '<div class="tiny muted">' + esc(r.loc) + ", " + esc(r.cc) + "</div>"
      + '<div class="dates">' + dateRange(r.start, r.date) + "</div>"
      + '<div class="badges">' + badge
      + (r.sprint ? '<span class="b spr">Sprint</span>' : "") + "</div>"
      + "</div>";
  }).join("");
  return '<div class="section"><div class="grid sched">' + cards + "</div></div>";
}

function vResults(c){
  if(!c.races.length) return '<div class="empty">No completed rounds in this season yet.</div>';

  const top = (key, fmt) => {
    const x = c.wdc.slice().sort((a,b) => b[key] - a[key])[0];
    return x && x[key] > 0 ? [esc(drvName(x.id)), fmt(x)] : ["—", ""];
  };
  const mostWins    = top("wins",    x => x.wins + (x.wins === 1 ? " win" : " wins"));
  const mostPodiums = top("podiums", x => x.podiums + " podiums");
  const mostPoles   = top("poles",   x => x.poles + (x.poles === 1 ? " pole" : " poles"));
  const bestAvg = c.regulars.filter(x => x.avgFin != null)
                            .sort((a,b) => a.avgFin - b.avgFin)[0];

  const tiles = [
    ["Most wins", mostWins[0], mostWins[1]],
    ["Most podiums", mostPodiums[0], mostPodiums[1]],
    ["Most poles", mostPoles[0], mostPoles[1]],
    ["Best average finish",
      bestAvg ? esc(drvName(bestAvg.id)) : "—",
      bestAvg ? "P" + bestAvg.avgFin.toFixed(2) + " over " + bestAvg.starts + " starts" : ""],
    ["Largest winning margin",
      c.wideWin ? gap(c.wideWin.m) : "—",
      c.wideWin ? esc(drvName(c.wideWin.id)) + " · " + esc(c.wideWin.race.name) : ""],
    ["Closest winning margin",
      c.tightWin ? gap(c.tightWin.m) : "—",
      c.tightWin ? esc(drvName(c.tightWin.id)) + " · " + esc(c.tightWin.race.name) : ""],
    ["Biggest position gain",
      c.bigGain ? "+" + c.bigGain.g + " places" : "—",
      c.bigGain ? esc(drvName(c.bigGain.id)) + " · " + esc(c.bigGain.race.name) : ""],
  ].map(x => '<div class="tile"><div class="k">' + x[0] + '</div><div class="v">' + x[1]
             + '</div><div class="s">' + x[2] + "</div></div>").join("");

  const winnerOf = r => {
    const row = r.res.find(x => x[R_POS] === 1);
    return row ? drvCell(row[R_DRV], row[R_TEAM]) : DASH;
  };
  const poleOf = r => {
    const q = r.qual.find(x => x[1] === 1);
    if(!q) return DASH;
    const row = r.res.find(x => x[R_DRV] === q[0]);
    return drvCell(q[0], row ? row[R_TEAM] : null);
  };
  const sprintCell = (r, pred) => {
    if(!r.sprint) return '<span class="tiny muted">no sprint</span>';
    if(!r.spr || !r.spr.length) return DASH;
    const row = r.spr.find(pred);
    return row ? drvCell(row[R_DRV], row[R_TEAM]) : DASH;
  };

  const rows = c.races.slice().reverse().map(r =>
    '<tr><td class="pos">' + r.r + "</td>"
    + '<td><span class="cc">' + r.iso + "</span>" + esc(r.name) + "</td>"
    + "<td>" + winnerOf(r) + "</td>"
    + "<td>" + poleOf(r) + "</td>"
    + "<td>" + sprintCell(r, x => x[R_POS] === 1) + "</td>"
    + "<td>" + sprintCell(r, x => x[R_GRID] === 1) + "</td></tr>").join("");

  const table = '<div class="tw"><table><thead><tr>'
    + "<th>Rd</th><th>Grand Prix</th><th>Winner</th><th>Pole</th>"
    + "<th>Sprint winner</th><th>Sprint pole</th>"
    + "</tr></thead><tbody>" + rows + "</tbody></table></div>";

  const CODES = {R:"DNF", D:"DSQ", W:"DNS", E:"EXC", N:"NC", F:"DNQ"};
  const heads = c.races.map(r =>
    '<th title="' + esc(r.name) + '"><span class="cc">' + r.iso + "</span><br>" + r.r + "</th>").join("");
  const grid = c.wdc.map(x => {
    const cells = c.races.map(r => {
      const row = r.res.find(y => y[R_DRV] === x.id);
      const spr = (r.spr || []).find(y => y[R_DRV] === x.id);
      if(!row) return '<td class="z">–</td>';
      const code = CODES[row[R_PTXT]];
      if(code) return '<td class="dnf" title="' + esc(row[R_STAT]) + '">' + code + "</td>";
      const pts = row[R_PTS] + (spr ? spr[R_PTS] : 0);
      const cls = row[R_POS] === 1 ? "win" : (pts === 0 ? "z" : "");
      return '<td class="' + cls + '" title="P' + row[R_POS]
        + (spr ? " · sprint P" + spr[R_POS] : "") + '">' + fmtPts(pts) + "</td>";
    }).join("");
    return '<tr><td class="dh">' + drvCell(x.id, x.teamId) + "</td>"
      + cells + '<td class="tot">' + fmtPts(x.pts) + "</td></tr>";
  }).join("");

  const pg = '<div class="pg"><table><thead><tr><th class="dh">Driver</th>'
    + heads + '<th class="tot">Pts</th></tr></thead><tbody>' + grid + "</tbody></table></div>";

  return '<div class="section"><h3>Season highlights</h3><div class="grid tiles">' + tiles + "</div></div>"
    + '<div class="section"><h3>Round by round</h3>' + table + "</div>"
    + '<div class="section"><h3>Driver points by round '
    + '<span class="tiny" style="text-transform:none;letter-spacing:0">'
    + "(race + sprint, hover a cell for detail)</span></h3>" + pg + "</div>";
}

function standingsTable(list, label, cell){
  if(!list.length) return '<div class="empty">Nothing to show yet.</div>';
  const rows = list.map(x =>
    '<tr><td class="pos">' + x.pos + "</td>"
    + "<td>" + cell(x) + "</td>"
    + '<td class="num pts">' + fmtPts(x.pts) + "</td>"
    + '<td class="num"><span class="delta ' + (x.last > 0 ? "up" : "zero") + '">'
    + (x.last > 0 ? "+" + fmtPts(x.last) : "—") + "</span></td>"
    + '<td class="num">' + x.wins + "</td>"
    + '<td class="num">' + x.podiums + "</td>"
    + '<td class="num">' + x.poles + "</td></tr>").join("");
  return '<div class="tw"><table><thead><tr>'
    + "<th>Pos</th><th>" + label + '</th><th class="num">Points</th>'
    + '<th class="num">This round</th><th class="num">Wins</th>'
    + '<th class="num">Podiums</th><th class="num">Poles</th>'
    + "</tr></thead><tbody>" + rows + "</tbody></table></div>";
}

const vWDC = c => '<div class="section">'
  + standingsTable(c.wdc, "Driver", x => drvCell(x.id, x.teamId)) + "</div>";
const vWCC = c => '<div class="section">'
  + standingsTable(c.wcc, "Constructor", x => teamChip(x.id)) + "</div>";

function vDrivers(c){
  if(!c.wdc.length) return '<div class="empty">No driver data for this round yet.</div>';
  const st = (k,v) => '<div><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
  const cards = c.wdc.map(x => {
    const d = drv(x.id), t = team(x.teamId);
    return '<div class="dcard">'
      + '<div class="livery"><i style="background:' + t.c + '"></i>'
      + '<i style="background:#11151d"></i><i style="background:' + t.c + '"></i></div>'
      + '<div class="top">'
      +   '<div class="mono" style="background:' + t.c + ';color:' + ink(t.c) + '">' + esc(d.c) + "</div>"
      +   '<div class="who"><div class="n">' + esc(drvName(x.id)) + "</div>"
      +   '<div class="t">' + esc(t.n) + "</div></div>"
      +   '<div class="no">' + esc(d.n || "") + "</div>"
      + "</div>"
      + '<div class="stats">'
      +   st("Points", fmtPts(x.pts))
      +   st("Championship", "P" + x.pos)
      +   st("Avg qualifying", x.avgQual != null ? "P" + x.avgQual.toFixed(1) : "—")
      +   st("Avg finish",    x.avgFin  != null ? "P" + x.avgFin.toFixed(1)  : "—")
      +   st("Best finish",   x.best != null ? "P" + x.best : "—")
      +   st("Starts", x.starts)
      + "</div></div>";
  }).join("");
  return '<div class="section"><div class="grid cards">' + cards + "</div></div>";
}

function vTeams(c){
  if(!c.wcc.length) return '<div class="empty">No constructor data for this round yet.</div>';
  const st = (k,v) => '<div><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";

  const cards = c.wcc.map(x => {
    const t = team(x.id);
    const seats = c.perTeam[x.id] || {};
    const lineup = Object.keys(seats)
      .sort((a,b) => seats[b] - seats[a] || drvName(a).localeCompare(drvName(b)))
      .map(id =>
        '<div class="lineup"><span>' + esc(drvName(id))
        + ' <span class="tname">#' + esc(drv(id).n || "") + "</span></span>"
        + '<span class="pts">' + fmtPts(seats[id]) + "</span></div>").join("");
    return '<div class="dcard">'
      + '<div class="livery" style="height:34px">'
      +   '<i style="background:' + t.c + '"></i><i style="background:#11151d;flex:.35"></i>'
      +   '<i style="background:' + t.c + '"></i></div>'
      + '<div class="top"><div class="who">'
      +   '<div class="n">' + esc(t.n) + "</div>"
      +   '<div class="t">' + esc(t.nat || "") + "</div></div>"
      +   '<div class="no">P' + x.pos + "</div></div>"
      + '<div class="stats">'
      +   st("Points", fmtPts(x.pts)) + st("Wins", x.wins)
      +   st("Podiums", x.podiums)    + st("Poles", x.poles)
      + "</div>" + lineup + "</div>";
  }).join("");
  return '<div class="section"><div class="grid cards">' + cards + "</div></div>";
}

/* ---------------- shell ---------------- */
const TITLES = {
  schedule:      ["Schedule", s => s.races.length + " rounds · " + s.season + " season"],
  results:       ["Results", () => "Race by race through round " + state.round],
  "drivers-wdc": ["Driver Standings", () => "World Drivers' Championship after round " + state.round],
  "teams-wcc":   ["Constructor Standings", () => "World Constructors' Championship after round " + state.round],
  drivers:       ["Drivers", () => "Season form after round " + state.round
                    + " · the API carries no photos, so cards use team-coloured code badges"],
  teams:         ["Teams", () => "Constructors after round " + state.round
                    + " · liveries drawn from team colours, not photography"],
};

function render(){
  const s = S();
  const c = compute();
  const spec = TITLES[state.view];
  $("#viewTitle").textContent = spec[0];
  $("#viewSub").textContent = spec[1](s);
  $("#brandSub").textContent = s.season + " season";

  const body = {
    schedule:      () => vSchedule(),
    results:       () => vResults(c),
    "drivers-wdc": () => vWDC(c),
    "teams-wcc":   () => vWCC(c),
    drivers:       () => vDrivers(c),
    teams:         () => vTeams(c),
  }[state.view]();

  $("#view").innerHTML = body;
  const btns = document.querySelectorAll("#nav button");
  for(let i = 0; i < btns.length; i++)
    btns[i].setAttribute("aria-current", String(btns[i].dataset.v === state.view));
  window.scrollTo(0, 0);
}

function fillRounds(){
  const done = S().races.filter(r => r.done);
  $("#roundSel").innerHTML = done.slice().reverse().map(r =>
    '<option value="' + r.r + '">R' + r.r + " – " + esc(r.name) + "</option>").join("")
    || '<option value="0">no completed rounds</option>';
  state.round = done.length ? done[done.length - 1].r : 0;
  $("#roundSel").value = String(state.round);
}

function init(){
  const seasons = Object.keys(DB.seasons).sort().reverse();
  state.season = seasons[0];

  $("#nav").innerHTML = VIEWS.map(v =>
    '<button data-v="' + v.id + '"><span class="ico">' + v.ico + "</span>" + v.label + "</button>").join("");
  $("#nav").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(b){ state.view = b.dataset.v; render(); }
  });

  $("#seasonSel").innerHTML = seasons.map(s => '<option value="' + s + '">' + s + "</option>").join("");
  $("#seasonSel").value = state.season;
  $("#seasonSel").addEventListener("change", e => {
    state.season = e.target.value; fillRounds(); render();
  });
  $("#roundSel").addEventListener("change", e => {
    state.round = +e.target.value; render();
  });

  $("#builtAt").textContent = "Snapshot built " + BUILT;
  fillRounds();
  render();
}
init();
</script>
